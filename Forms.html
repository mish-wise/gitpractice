<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">


</head>
<body>

<div class="row">
    <div class="col-sm-6 mx-auto">
        <form action="">
            <div class="mt-3 mb-3">
                <label for="first_name" class="form-label text-danger">first_name</label>
                <input type="first_name" class="form-control rounded-0" id="first_name">
            </div>

            <div class="mt-3 mb-3">
                <label for="second_name " class="form-label">second_name</label>
                <input type="second_name" class="form-control" id="second_name ">
            </div>

            <div class="mt-3 mb-3">
                <label for="email " class="form-label">email</label>
                <input type="email" class="form-control" id="email ">
            </div>
            <div class="mt-3 mb-3">
                <label for="password" class="form-label">password</label>
                <input type="password" class="form-control" id="password">
            </div>
            <div class="mt-3 mb-3">
                <label for="edu" class="form-label"> education level</label>
                <select name="edu" id="edu" class="form-select">
                    <option value="">University</option>
                    <option value="">College</option>
                    <option value="">Polytechnic</option>
                    <option value="">Highschool</option>
                    <option value="">Other</option>

                </select>
            </div>

            <div class="form-check">
                <input type="radio" class="form-check-input" id="radio1" name="gender" value="option1">Female
                <label class="form-check-label" for="radio1"></label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="radio2" name="gender" value="option2">Male
                <label class="form-check-label"></label>
            </div>
<!--button.btn.btn-danger or btn-dark-->
<button class="btn btn-dark mt-4 w-100">Register</button>

        </form>
    </div>
    t
</div>


</body>
</html>
